name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Dominio propio: el del archivo CNAME del repositorio (lo crea GitHub al ponerlo en Settings → Pages)
      # o, si no existe, la variable CUSTOM_DOMAIN. Sin ninguno: https://usuario.github.io/nombre-repo/
      - id: domain
        run: |
          d="$(tr -d '[:space:]' < CNAME 2>/dev/null || true)"
          [ -z "$d" ] && d="${{ vars.CUSTOM_DOMAIN }}"
          echo "name=$d" >> "$GITHUB_OUTPUT"
      - run: npm run build
        env:
          SITE_URL: ${{ steps.domain.outputs.name && format('https://{0}', steps.domain.outputs.name) || format('https://{0}.github.io', github.repository_owner) }}
          BASE_PATH: ${{ steps.domain.outputs.name && '/' || format('/{0}/', github.event.repository.name) }}
          PUBLIC_RSVP_ENDPOINT: ${{ vars.PUBLIC_RSVP_ENDPOINT }}
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
